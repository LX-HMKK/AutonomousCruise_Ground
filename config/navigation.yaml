# config/navigation.yaml
# ========================================
# 导航全部参数（单源真理）
# move_base.launch.xml 在 carto 默认参数之后加载此文件，
# 同命名空间的键直接覆盖，无需修改 robot_slam/params/carto/
# ========================================
# 调参指南:
#   旋转太慢         → 增大 max_vel_theta / acc_lim_theta
#   目标点附近抽搐   → 增大 xy_goal_tolerance / yaw_goal_tolerance
#   路径箭头闪空白   → 增大 sim_time (>1.7)
#   贴障碍物太近     → 增大 inflation_radius / occdist_scale
#   路径绕远路       → 减小 inflation_radius / cost_scaling_factor
#   末端来回震荡     → 增大 oscillation_reset_dist
# ========================================

# ---- 全局代价地图 (4m×4m，覆盖 3.6m 场地 + 边距) ----
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 2.0
  update_frequency: 2.0
  publish_frequency: 1.0
  static_map: true
  rolling_window: false
  width: 4.0                # 场地 3.6m + 两侧各 0.2m 边距
  height: 4.0
  resolution: 0.02           # 5cm/pixel，精度足够
  obstacle_range: 1.5        # 障碍物检测距离 (m)
  raytrace_range: 2.5        # 射线清除距离 (m)，大于 obstacle_range
  inflation_radius: 0.22     # 障碍物膨胀半径 (m)，留足安全距离
  cost_scaling_factor: 10.0  # 代价衰减 (1~20)，越大障碍物影响范围越小
  map_type: costmap

# ---- 局部代价地图 (2m×2m 滚动窗口) ----
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  transform_tolerance: 2.0
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 2.0                 # 机器人周围 ±1m
  height: 2.0
  resolution: 0.02
  obstacle_range: 1.5
  raytrace_range: 2.0
  inflation_radius: 0.1      # 局部膨胀半径，比全局小（更精细避障）
  cost_scaling_factor: 3.0   # 局部代价衰减，比全局小（更灵敏）
  map_type: costmap

# ---- DWA 局部规划器 ----
DWAPlannerROS:
  # -- 速度 --
  max_vel_x: 0.55             # 最大前向速度 (m/s)
  min_vel_x: -0.20            # 最大后退速度
  max_vel_y: 0.20             # 全向横移速度 (m/s)
  min_vel_y: -0.20
  max_vel_trans: 0.55         # 实际平移限幅
  min_vel_trans: 0.02
  max_vel_theta: 2.5          # 最大旋转速度 (rad/s), ≈143°/s
  min_vel_theta: 1.0          # 最小旋转速度, 太低会在接近目标时转不动
  # -- 加速度 --
  acc_lim_x: 2.5              # 前向加速度 (m/s²)
  acc_lim_y: 2.5              # 横移加速度
  acc_lim_theta: 4.0          # 旋转加速度 (rad/s²)
  # -- 到达判定 --
  xy_goal_tolerance: 0.05     # 位置容差 (m)
  yaw_goal_tolerance: 0.03    # 朝向容差 (rad), ≈1.7° 提高旋转精度
  latch_xy_goal_tolerance: false
  # -- 轨迹模拟 --
  sim_time: 1.7               # 前向模拟时长 (s), 越大轨迹越平滑, <1.5 会箭头闪
  vx_samples: 10              # x 速度采样数
  vy_samples: 7               # y 速度采样数 (全向轮建议 5~10)
  vth_samples: 20             # 角速度采样数
  controller_frequency: 10.0
  # -- 代价权重 --
  path_distance_bias: 32.0    # 跟全局路径权重, 越大越贴路径
  goal_distance_bias: 24.0    # 朝目标前进权重, 越大路径越直接
  occdist_scale: 0.05         # 避障权重 (0.01~0.10), 越大离障碍越远
  # -- 其他 --
  forward_point_distance: 0.325
  stop_time_buffer: 0.2       # 碰撞前停车缓冲 (s)
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  oscillation_reset_dist: 0.05  # 移动超过此距离重置震荡检测
  publish_traj_pc: true         # 发布轨迹点云 (RViz 可视化)
  publish_cost_grid_pc: true    # 发布代价网格 (RViz 可视化)
  holonomic_robot: true         # 全向底盘 (麦克纳姆轮)

# ---- 全局规划器 ----
GlobalPlanner:
  old_navfn_behavior: false
  use_quadratic: true
  use_dijkstra: true           # Dijkstra 算法 (true=最短路径, false=A*)
  use_grid_path: false
  allow_unknown: true          # 允许穿过未知区域规划
  default_tolerance: 0.1       # 目标点被障碍物占据时，在此半径内找最近可行点 (m)
  publish_scale: 100
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 3.0
  publish_potential: true

# ---- move_base 全局参数 ----
controller_frequency: 10.0
controller_patience: 15.0      # 控制器容忍超时 (s)
planner_frequency: 5.0         # 全局规划重规划频率 (Hz)
planner_patience: 5.0
oscillation_timeout: 10.0      # 震荡超时 (s)
oscillation_distance: 0.2
base_local_planner: "dwa_local_planner/DWAPlannerROS"
base_global_planner: "global_planner/GlobalPlanner"
shutdown_costmaps: false

# ---- 安全边距 (独立于 move_base，由状态机使用) ----
fence_safety_margin_m: 0.15
