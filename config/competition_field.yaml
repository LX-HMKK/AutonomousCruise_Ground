# config/competition_field.yaml
# 比赛场地完整描述：尺寸、网格、起终点、任务点、障碍物、任务图像位置

field:
  size_m: [3.6, 3.6]
  grid_rows: 9
  grid_cols: 9
  cell_size_m: 0.4
  fence_height_m: 0.30

# 网格编号约定：PDF 图中 1 在左上角(西北)，9 在右上角(东北)，
# 73 在左下角(西南)，81 在右下角(东南)。
# map 坐标系：以场地中心为原点，x 轴向东，y 轴向北。
cell_index_convention:
  description: >
    网格 1 在左上角，按行优先排列。
    网格编号 N 对应的 map 坐标：
      row = (N - 1) // 9   (0 为最北行)
      col = (N - 1) % 9    (0 为最西列)
      x = (col - 4) * 0.4 + 0.2
      y = (4 - row) * 0.4 - 0.2

start_cells: [1, 81]
finish_cell: 9

# 9 个候选任务区 (中央 3×3 区域)
task_cells: [31, 32, 33, 40, 41, 42, 49, 50, 51]

# 4 个视觉读取位置 (围栏内侧贴任务信息图像)
vision_positions: [5, 37, 45, 77]

# 视觉位置 → (任务区, 车头朝向)  (车头对墙才能拍到围栏上的任务图像)
# yaw_rad: 0=东 +π/2=北 ±π=西 -π/2=南
vision_to_task:
  5:  { target: 41,  yaw_rad: 1.57 }    # 对北墙
  37: { target: 33,  yaw_rad: 3.14 }    # 对西墙
  45: { target: 50,  yaw_rad: 0.0  }    # 对东墙
  77: { target: 31,  yaw_rad: -1.57}    # 对南墙

task_region:
  size_m: [0.38, 0.32]
  description: "任务点区域 38cm x 32cm，在对应黄色格子中居中"

# 内部 8×8 区域随机挡板 (仿真用于测试避障)
# cell: 格子编号  yaw_deg: 挡板朝向(角度), 0=水平 90=竖直 45=斜向
obstacles:
  - { cell: 23, yaw_deg: 90 }
  - { cell: 40, yaw_deg: 0  }
  - { cell: 43, yaw_deg: 90 }
  - { cell: 59, yaw_deg: 0 }

obstacles_config:
  board_size_m: [0.01, 0.4]
  description: "挡板 40cm x 30cm，随机放置在红色线路上，可在此添加 cell 编号启用"

task_images:
  count: 4
  center_height_m: 0.20
  placed_on_inner_fence: true
  description: "4 张任务信息图像贴在围栏内侧，中心距地面 20cm"
